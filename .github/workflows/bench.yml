name: bench
on:
  workflow_dispatch:
    inputs:
      only:
        description: "GUIs to run, comma separated"
        default: "ngw,ngw-p1,Nvy,nvim-qt"
  push:
    branches: [main]
jobs:
  bench:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        vm: [1, 2, 3]   # three separate VMs: shows how much VMs differ
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build ngw
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/ngw.exe ./cmd/ngw
      - name: Install Neovim and the other GUIs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest https://github.com/neovim/neovim/releases/download/stable/nvim-win64.zip -OutFile tools/nvim.zip
          Expand-Archive tools/nvim.zip tools/nvim
          $nvimBin = (Get-ChildItem -Recurse tools/nvim -Filter nvim.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $nvimBin
          function Fetch($repo, $dir, $exe) {
            # Every Windows-looking .zip/.exe asset of the latest release;
            # the exe is then searched for, so asset names do not matter.
            New-Item -ItemType Directory -Force "tools/$dir" | Out-Null
            try {
              $rel = gh api "repos/$repo/releases/latest" | ConvertFrom-Json
              Write-Host "$repo $($rel.tag_name): $(($rel.assets | ForEach-Object name) -join ', ')"
              foreach ($a in $rel.assets) {
                if ($a.name -notmatch '\.(zip|exe)$' -or $a.name -match 'linux|mac|darwin|apple|appimage|aarch64|arm64|setup|installer') { continue }
                $dest = "tools/$dir/$($a.name)"
                Invoke-WebRequest $a.browser_download_url -OutFile $dest
                if ($a.name -like '*.zip') { Expand-Archive $dest "tools/$dir" -Force }
              }
              $e = Get-ChildItem -Recurse "tools/$dir" -Filter $exe | Select-Object -First 1
              if ($e) { Write-Host "found $($e.FullName)"; return $e.FullName }
              Write-Host "no $exe in $repo assets"
            } catch { Write-Host "failed to fetch $repo : $_" }
            return ""
          }
          "NGW_EXE=$((Resolve-Path dist/ngw.exe).Path)" | Add-Content $env:GITHUB_ENV
          "NVY_EXE=$(Fetch 'RMichelsen/Nvy' 'nvy' 'Nvy.exe')" | Add-Content $env:GITHUB_ENV
          "NEOVIDE_EXE=$(Fetch 'neovide/neovide' 'neovide' 'neovide.exe')" | Add-Content $env:GITHUB_ENV
          "NVIMQT_EXE=$(Fetch 'equalsraf/neovim-qt' 'nvimqt' 'nvim-qt.exe')" | Add-Content $env:GITHUB_ENV
      - name: Make the sample file
        shell: pwsh
        run: |
          $src = Get-ChildItem -Recurse internal -Filter *.go | Get-Content
          $jp = "日本語のテキスト：漢字・ひらがな・カタカナ・ｶﾀｶﾅ（半角）と English が混ざった行"
          $lines = @(); while ($lines.Count -lt 6000) { $lines += $src; $lines += $jp }
          $lines | Set-Content bench/sample.txt -Encoding utf8
      - name: Benchmark
        shell: pwsh
        run: |
          nvim --version | Select-Object -First 1
          ./bench/bench.ps1 -Out results -Repeat 5 -Only "${{ inputs.only || 'ngw,ngw-p1,Nvy,nvim-qt' }}"
      - name: Profile ngw
        shell: pwsh
        run: |
          $env:NGW_PROFILE_DIR = (New-Item -ItemType Directory -Force prof).FullName
          ./bench/bench.ps1 -Out prof-run -Only ngw -Repeat 1 -Startups 0 | Out-Null
          "== stats"; Get-Content prof/stats.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-vm${{ matrix.vm }}
          path: |
            results/
            prof/
