name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test ./...
      - run: go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/ngw.exe ./cmd/ngw
      - uses: actions/upload-artifact@v4
        with:
          name: ngw-windows-amd64
          path: dist/ngw.exe
